<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <meta content="#07100f" name="theme-color" />
    <meta content="noindex,nofollow" name="robots" />
    <title>
        Status do pedido &mdash; PASSO LABS
    </title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Grotesk:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <!-- Folha de estilo -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet" />
    <!-- Folha de estilo -->
    <link href="assets/css/style.css" rel="stylesheet" />
</head>

<body class="checkout-page">
    <div class="announcement">
        PASSO CHECKOUT
        <strong>
            &bull; STATUS DO PEDIDO
        </strong>
    </div>
    <!-- ===== CABEÇALHO: .header ===== -->
    <header class="checkout-header header">
        <div class="container nav">
            <a class="logo" href="home.html">
                <span class="logo-mark">
                    <i class="fa-arrow-right fa-solid">
                    </i>
                </span>
                passo
                <span style="color: #8b9b76">
                    .
                </span>
            </a>
            <a class="checkout-back" href="home.html">
                <i class="fa-arrow-left fa-solid">
                </i>
                Voltar &agrave; loja
            </a>
        </div>
    </header>
    <!-- ===== CONTEÚDO PRINCIPAL: .checkout-main ===== -->
    <main class="checkout-main">
        <div class="checkout-status-card">
            <div class="checkout-status-icon" id="statusIcon">
                <i class="fa-solid fa-spin fa-spinner">
                </i>
            </div>
            <div class="checkout-eyebrow">
                PASSO / PEDIDO
            </div>
            <h1 id="statusTitle">
                Consultando seu pedido
                <span style="color: var(--lime)">
                    .
                </span>
            </h1>
            <p id="statusDescription">
                Estamos confirmando o status diretamente com o Mercado Pago.
            </p>
            <div class="checkout-order-number" id="statusOrderId">
            </div>
            <div class="checkout-status-total" id="statusTotal">
            </div>
            <div aria-live="polite" class="checkout-notice is-visible" id="statusNotice" role="status">
                N&atilde;o feche esta p&aacute;gina enquanto consultamos a atualiza&ccedil;&atilde;o do pagamento.
            </div>
            <div class="checkout-status-actions">
                <a class="btn btn-dark" href="home.html#colecao">
                    Continuar comprando
                    <i class="fa-arrow-right fa-solid">
                    </i>
                </a>
                <button class="checkout-secondary" id="checkStatus" type="button">
                    Consultar novamente
                    <i class="fa-rotate fa-solid">
                    </i>
                </button>
            </div>
        </div>
    </main>
    <!-- ===== RODAPÉ: .checkout-footer ===== -->
    <footer class="checkout-footer">
        &copy;
        <span id="checkoutYear">
        </span>
        PASSO LABS &middot; Move Beyond
    </footer>
    <!-- Script -->
    <script defer="" src="assets/js/order-status.js">
    </script>
</body>

</html>
